// Compatibility entry point: normal Gradle configuration now owns fork identity/version.
// Keep accepting old invocations without overriding any Android configuration.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        if (project.extensions.extraProperties.has('mihon.acceptanceIdentity')) {
            throw new GradleException('Do not combine Android identity scripts')
        }
        project.extensions.extraProperties.set('mihon.forkCompatibility', true)
    }
}
