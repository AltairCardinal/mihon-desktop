<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Mihon · 提交安全验证 / Verification</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/verify-boot.mjs"></script>
  </head>
  <body>
    <main>
      <header><span class="brand">Mihon</span><button id="language" type="button">English</button></header>
      <h1 id="heading">提交安全验证</h1>
      <p id="explanation">问题内容和日志保留在应用中，本页只进行安全验证，不会接收这些内容。</p>
      <div id="challenge" aria-label="Security verification"></div>
      <button id="verify" type="button" disabled>完成验证</button>
      <p id="status" role="status" aria-live="polite" tabindex="-1">正在连接验证服务…</p>
    </main>
  </body>
</html>
