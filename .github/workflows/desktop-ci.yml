name: Desktop CI

on:
  # Local product tests are the normal gate; run this legacy workflow explicitly when needed.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-test:
    name: Desktop JVM Tests
    # The Desktop product is currently validated and released for Windows.
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Parity and reader-authority tests resolve fixed historical Git objects.
          fetch-depth: 0

      - name: Determine CI scope
        id: scope
        run: python scripts/ci-scope.py

      - name: Validate documentation and CI routing
        if: steps.scope.outputs.needs_product == 'false'
        run: python scripts/tests/ci-scope-test.py

      - name: Fetch provenance authority references
        if: steps.scope.outputs.needs_product == 'true'
        # The independent downstream repository retains these immutable references
        # solely so authority-contract tests can resolve their fixed Git objects.
        run: git fetch --no-tags origin +refs/heads/upstream/main:refs/remotes/origin/upstream/main +refs/heads/provenance/fixed-main:refs/remotes/origin/provenance/fixed-main

      - name: Set up JDK
        if: steps.scope.outputs.needs_product == 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        if: steps.scope.outputs.needs_product == 'true'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Check code format
        if: steps.scope.outputs.needs_product == 'true'
        run: ./gradlew spotlessCheck

      - name: Run Desktop JVM tests
        id: desktop_tests
        if: steps.scope.outputs.needs_product == 'true'
        run: ./gradlew :app-desktop:jvmTest

      - name: Upload test report
        if: ${{ failure() && steps.desktop_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-test-report-${{ github.sha }}
          path: app-desktop/build/reports/tests/jvmTest
