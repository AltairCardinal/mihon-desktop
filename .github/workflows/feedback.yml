name: Anonymous feedback checks

on:
  pull_request:
    paths:
      - 'services/feedback/**'
      - '.github/workflows/feedback.yml'
  push:
    branches: [main]
    paths:
      - 'services/feedback/**'
      - '.github/workflows/feedback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/feedback
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/feedback/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
