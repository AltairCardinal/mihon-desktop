name: Build & Test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test App
    runs-on: 'ubuntu-24.04'
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Check Python and install Android SDK baseline
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11 or newer is required"'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          python3 scripts/build-android.py check

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Check Android delivery contracts
        run: |
          python3 scripts/tests/build-android-test.py
          python3 scripts/tests/gradle-coordinator-test.py

      - name: Build unsigned Android candidate
        id: candidate
        run: |
          if python3 scripts/build-android.py candidate --unsigned; then
            exit 0
          fi
          if [ -f .gradle-coordinator/android-candidate.log ]; then
            tail -n 160 .gradle-coordinator/android-candidate.log
          fi
          exit 1

      - name: Run unit tests
        id: unit_tests
        if: github.event_name != 'workflow_dispatch'
        run: ./gradlew testReleaseUnitTest

      - name: Upload test report
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testReleaseUnitTest

      - name: Upload unsigned universal candidate and evidence
        if: always() && steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-unsigned-universal-${{ github.sha }}
          # The immutable candidate directory contains APK, artifact.json and its R8 mapping.
          path: app/artifacts/android/*-unsigned/
          if-no-files-found: error
