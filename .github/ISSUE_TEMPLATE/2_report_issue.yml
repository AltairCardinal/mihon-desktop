name: 🐞 Android / Desktop issue report
description: Report a problem in this Mihon fork (Android, Windows, macOS or Linux)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This issue will be **public** and requires a GitHub account. Please review everything before submitting.
        In the app, open **More → About → Report a problem**, preview the safe summary, and copy it below.
        The app does not create an issue, upload files, or attach logs automatically.
        此问题将公开显示，需要 GitHub 账号。请先在应用「更多 → 关于 → 报告问题」预览并复制安全摘要，提交前检查内容。

  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - Android
        - Windows Desktop
        - macOS Desktop
        - Linux Desktop
    validations:
      required: true

  - type: textarea
    id: safe-summary
    attributes:
      label: Safe diagnostic summary / 安全诊断摘要
      description: Paste the summary from About. It contains only the app version, OS, architecture and runtime. Do not add an installation ID, account, token, library data or a profile path.
      render: text
    validations:
      required: true

  - type: dropdown
    id: update-channel
    attributes:
      label: Update channel / 更新渠道
      options:
        - Stable and testing / 稳定版和测试版
        - Stable only / 仅稳定版
        - Unknown / 不确定
    validations:
      required: true

  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Provide an example of the issue.
      placeholder: |
        Example:
          1. First step
          2. Second step
          3. Issue here
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you should expect to happen.
      placeholder: |
        Example:
          "This should happen..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain what actually happens.
      placeholder: |
        Example:
          "This happened instead..."
    validations:
      required: true

  - type: textarea
    id: crash-logs
    attributes:
      label: Optional reviewed logs / 可选：已检查的日志
      description: |
        Logs are optional and may contain private information. Android: **More → Settings → Advanced → Dump crash logs**. Desktop: **Settings → Advanced → Open crash log folder**.
        Review the content locally and remove tokens, cookies, authorization headers, account details, installation IDs, private URLs, local paths and library/reading information before attaching it. Do not upload the original file without reviewing it.
        日志不会自动附加。使用现有日志工具后，请先在本机检查并删除凭据、账号、安装标识、私人网址、路径和书库/阅读信息。
      placeholder: |
        Paste only the reviewed and redacted part relevant to this problem.

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details and attachments.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Read this carefully, we will close and ignore your issue if you skimmed through this.
      options:
        - label: I have searched the existing issues and this is a new ticket, **NOT** a duplicate or related to another open or closed issue.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: I have checked the available [releases for this project](https://github.com/AltairCardinal/mihon-desktop/releases), including testing releases if that channel is enabled.
          required: true
        - label: I have filled out all of the requested information in this form, including specific version numbers.
          required: true
        - label: I have checked that this public report and any optional attachments contain no private information or credentials.
          required: true
