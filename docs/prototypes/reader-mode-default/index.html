<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Mihon · 阅读设置 v3 双端审阅</title>
<link rel="stylesheet" href="preview-v3.css">
<style>:root{color-scheme:dark}body{margin:0;padding:28px 20px;background:#191a22}main{max-width:960px;margin:auto}header{margin-bottom:24px;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:#aeb4c7}h1{margin:0 0 4px;font-size:22px;font-weight:500;color:#eef0f8}@media(max-width:560px){body{padding:16px 10px}}</style>
</head><body><main>
<header><h1>阅读模式设置 · v3</h1>桌面与移动端使用相同的设置层级和交互。</header>
<div id="reader-settings-v3-review" lang="zh-CN" aria-label="阅读器设置 v3 双端审批稿">
  <div class="review-tools" aria-label="应用外演示场景">
    <label>演示全局默认
      <select data-global aria-label="演示全局默认">
        <option value="paged-auto">横向阅读 · 自动单双页 · 从右到左</option>
        <option value="paged-single">横向阅读 · 单页 · 从右到左</option>
        <option value="paged-double">横向阅读 · 双页 · 从右到左</option>
        <option value="vertical-paged">纵向阅读 · 逐页翻动</option>
        <option value="webtoon">纵向阅读 · 连续滚动 · 页面有空隙</option>
      </select>
    </label>
  </div>
  <div class="review-stage">
    <section class="device" data-device="desktop" aria-label="桌面端预览">
      <div class="platform">Windows Desktop</div>
      <mihon-reader-settings storage-key="mihon.reader-settings.v3-review.desktop"></mihon-reader-settings>
    </section>
    <section class="device" data-device="android" aria-label="移动端预览">
      <div class="platform">Android · 同一交互</div>
      <mihon-reader-settings storage-key="mihon.reader-settings.v3-review.android"></mihon-reader-settings>
    </section>
  </div>
  <p class="review-boundary">交互审批稿 · 只保存本浏览器的演示选择，不修改应用设置。</p>
</div>
<script src="reader-settings-v3.js"></script><script src="preview-v3.js"></script>
</main></body></html>
